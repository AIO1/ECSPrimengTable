@if (shouldRender()) {
  @let btn = button();
  @let enabled = isEnabled();

  <button 
    type="button"
    [disabled]="!enabled"
    [pTooltip]="btn.tooltip || ''"
    [tooltipDisabled]="!btn.tooltip || btn.tooltip.length === 0"
    [showDelay]="150"
    tooltipPosition="top"
    [class]="buttonClasses()"
    [ngStyle]="buttonStyle()"
    (click)="handleClick($event)">
    
    @if (btn.icon && (!btn.iconPos || btn.iconPos === 'left')) {
      <span [class]="btn.icon" [style.margin-right]="btn.label ? '0.5rem' : '0'"></span>
    }
    
    @if (btn.label) {
      <span>{{ btn.label }}</span>
    }

    @if (btn.icon && btn.iconPos === 'right') {
      <span [class]="btn.icon" [style.margin-left]="btn.label ? '0.5rem' : '0'"></span>
    }
  </button>
}
