<div style="display: flex; align-items: center; gap: 0.5rem;"
     [style.cursor]="isSelectableWithAction() ? 'pointer' : 'default'"
     [attr.role]="isSelectableWithAction() ? 'button' : null"
     (click)="handleClick(); $event.stopPropagation();">
  @if (option()?.icon) {
    <i [class]="option().icon" 
       [style]="'vertical-align: middle; color: ' + (option().iconColor || '') + ';' + (option().iconStyle || '')">
    </i>
  }
  @if (!option()?.imageBlob && option()?.imageBlobSourceEndpoint) {
    <p-skeleton [style]="skeletonStyle()" />
  }
  @if (option()?.imageBlob) {
    <img alt="image" 
         [src]="safeBlobUrl()" 
         [style]="imageStyle()" />
  }
  @if (option()?.imageURL) {
    <img alt="iconFromURL" 
         [src]="option().imageURL" 
         [style]="imageStyle()" />
  }
  @if (option()?.displayTag === true) {
    <p-tag [innerHtml]="highlightedName()" 
           [style]="tagStyle()" 
           [value]="option().name" />
  }
  @if (option()?.displayName === true) {
    <span style="gap: 0;" 
          [innerHtml]="highlightedName()" 
          [ngStyle]="option().nameStyle || {}">
      {{ option().name }}
    </span>
  }
</div>
