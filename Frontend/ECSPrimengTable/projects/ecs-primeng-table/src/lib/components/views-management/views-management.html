<p-dialog [visible]="visible()" 
          [modal]="true" 
          [draggable]="false" 
          [resizable]="false"
          [closable]="true" 
          [closeOnEscape]="false" 
          [maximizable]="false" 
          [style]="{'min-width': '70vw', 'max-width': '70vw'}" 
          (onHide)="closeModal()">
    
    <ng-template pTemplate="header">
        <span class="p-dialog-title">Table views</span>
    </ng-template>
    <div class="p-4 pt-0">
        <p-table #dt_viewsDialog [value]="tableViews_menuItems()" [scrollable]="true" size="small" showGridlines stripedRows scrollHeight="400px">
            <ng-template #caption>
                <div class="flex justify-content-end">
                    <button pButton (click)="showViewEditor()" pTooltip="New view" tooltipPosition="top">
                        <span class="pi pi-plus"></span>
                        New view
                    </button>
                </div>
            </ng-template>
            <ng-template #header>
                <tr>
                    <th>View name</th>
                    <th style="width: 220px;">Load on startup</th>
                    <th style="width: 220px;">Actions</th>
                </tr>
            </ng-template>
            <ng-template #body let-rowData>
                <tr>
                    <td>{{rowData.label}}</td>
                    <td class="text-center">
                        <p-checkbox [(ngModel)]="rowData.lastActive" [binary]="true" (onChange)="onViewUpdateActiveStartup.emit(rowData.label)"/>
                    </td>
                    <td class="flex justify-content-center gap-2">
                        <button pButton [iconOnly]="true" size="small" (click)="onViewSelect.emit(rowData.label)" pTooltip="Restore">
                            <span class="pi pi-upload"></span>
                        </button>
                        <button pButton [iconOnly]="true" size="small" (click)="onViewUpdateData.emit(rowData.label)" pTooltip="Save">
                            <span class="pi pi-save"></span>
                        </button>
                        <button pButton [iconOnly]="true" size="small" (click)="showViewEditor(rowData.label)" pTooltip="Edit">
                            <span class="pi pi-pencil"></span>
                        </button>
                        <button pButton [iconOnly]="true" size="small" (click)="onViewDelete.emit(rowData.label)" pTooltip="Delete">
                            <span class="pi pi-trash"></span>
                        </button>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</p-dialog>
<p-dialog [(visible)]="viewEditorShow" [modal]="true" [style]="{'max-width': '60vw'}">
    <ng-template #header>
        <b>{{ editingViewAlias() ? 'UPDATE VIEW' : 'CREATE NEW VIEW' }}</b>
    </ng-template>
    <div class="flex flex-column gap-2">
        <label for="newtableviewname"><strong>View alias*</strong></label>
        <input pInputText id="newtableviewname" [(ngModel)]="newViewAlias" style="width: 400px;" maxlength="30"/>
    </div>
    <ng-template #footer>
        <button pButton [outlined]="true" (click)="viewEditorShow.set(false)">
            Cancel
        </button>
        <button pButton (click)="createOrUpdateTableView()">
            {{ editingViewAlias() ? 'Update' : 'Create' }}
        </button>
    </ng-template>
</p-dialog>
