<p-dialog [visible]="visible()" 
          [modal]="true" 
          [draggable]="false" 
          [resizable]="false"
          [closable]="true" 
          [closeOnEscape]="false" 
          [maximizable]="false" 
          [style]="{'min-width': '70vw', 'max-width': '70vw'}" 
          (onHide)="closeModal()">
    
    <ng-template #header>
        <span class="p-dialog-title">TABLE VIEWS</span>
    </ng-template>

    <div style="padding: 1rem; padding-top: 0;">
        <p-table #dt_viewsDialog [value]="tableViews_menuItems()" [scrollable]="true" size="small" showGridlines stripedRows scrollHeight="400px">
            <ng-template #caption>
                <div style="display: flex; justify-content: flex-end;">
                    <button type="button" class="p-button p-component" (click)="showViewEditor()" [pTooltip]="'New view'" tooltipPosition="top">
                        <span class="pi pi-plus" style="margin-right: 0.5rem;"></span>
                        <span>New view</span>
                    </button>
                </div>
            </ng-template>
            <ng-template #header>
                <tr>
                    <th>View name</th>
                    <th style="width: 220px;">Load on startup</th>
                    <th style="width: 220px;">Actions</th>
                </tr>
            </ng-template>
            <ng-template #body let-rowData>
                <tr>
                    <td>{{rowData.label}}</td>
                    <td style="text-align: center;">
                        <p-checkbox [(ngModel)]="rowData.lastActive" [binary]="true" (onChange)="onViewUpdateActiveStartup.emit(rowData.label)"/>
                    </td>
                    <td style="display: flex; justify-content: center; gap: 0.5rem;">
                        <button type="button" class="p-button p-component p-button-sm" (click)="onViewSelect.emit(rowData.label)" [pTooltip]="'Restore'" tooltipPosition="top">
                            <span class="pi pi-upload"></span>
                        </button>
                        <button type="button" class="p-button p-component p-button-sm" (click)="onViewUpdateData.emit(rowData.label)" [pTooltip]="'Save'" tooltipPosition="top">
                            <span class="pi pi-save"></span>
                        </button>
                        <button type="button" class="p-button p-component p-button-sm" (click)="showViewEditor(rowData.label)" [pTooltip]="'Edit'" tooltipPosition="top">
                            <span class="pi pi-pencil"></span>
                        </button>
                        <button type="button" class="p-button p-component p-button-sm" (click)="onViewDelete.emit(rowData.label)" [pTooltip]="'Delete'" tooltipPosition="top">
                            <span class="pi pi-trash"></span>
                        </button>
                    </td>
                </tr>
            </ng-template>
            <ng-template #emptymessage>
                <tr>
                    <td colspan="999" style="text-align: center; vertical-align: middle;">There are no views</td>
                </tr>
            </ng-template>
        </p-table>

        <div style="display: flex; flex-direction: row; justify-content: space-between; align-items: center; margin-top: 0.5rem; font-size: 0.875rem; color: var(--text-color-secondary, #6c757d);">
            There are {{ tableViews_menuItems().length }} views available
        </div>
    </div>
</p-dialog>

<p-dialog [visible]="viewEditorShow()" (visibleChange)="viewEditorShow.set($event)" [modal]="true" [closable]="false" [style]="{'max-width': '60vw'}">
    <ng-template #header>
        <b>{{ editingViewAlias() ? 'UPDATE VIEW' : 'CREATE NEW VIEW' }}</b>
    </ng-template>
    <div style="display: flex; flex-direction: column; gap: 0.5rem;">
        <label for="newtableviewname"><strong>View alias*</strong></label>
        <input pInputText id="newtableviewname" [ngModel]="newViewAlias()" (ngModelChange)="newViewAlias.set($event)" style="width: 400px;" maxlength="30"/>
    </div>
    <ng-template #footer>
        <button type="button" class="p-button p-component p-button-outlined" (click)="viewEditorShow.set(false)">
            Cancel
        </button>
        <button type="button" class="p-button p-component" (click)="createOrUpdateTableView()">
            {{ editingViewAlias() ? 'Update' : 'Create' }}
        </button>
    </ng-template>
</p-dialog>
